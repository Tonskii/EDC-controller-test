name: build-and-selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build EdcZkPush.sln -c Release
      - name: Start PUSH server
        run: |
          nohup dotnet run --no-build -c Release --project src/EdcZkPush.Api --urls http://127.0.0.1:8088 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8088/swagger/v1/swagger.json > swagger.json && break; sleep 1; done
          test -s swagger.json
      - name: Run simulated C3-400 Plus self test
        run: dotnet run --no-build -c Release --project tools/EdcZkPush.Simulator -- --server http://127.0.0.1:8088 --selftest
      - name: Server console output
        if: always()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            server.log
            swagger.json
            logs/
